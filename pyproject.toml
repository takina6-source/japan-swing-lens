[project]
name = "momentum-swing-engine"
version = "0.1.0"
description = "Explainable Japanese equity swing and momentum ranking engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "plotly>=5.24",
  "PyYAML>=6.0",
  "requests>=2.32",
  "streamlit>=1.40",
  "yfinance>=0.2.54",
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
jquants = ["jquants-api-client>=2.0"]
test = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["engine*"]
