name: Update Swing Lens

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1-5" # 平日19:00 JST

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: swing-lens-pages
  cancel-in-progress: false

jobs:
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[jquants,test]'
      - name: Run full test suite
        run: python -m pytest -q

  analyze-and-publish:
    name: Analyze and publish
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: data
          key: swing-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: swing-data-${{ runner.os }}-
      - run: python -m pip install -e '.[jquants]'
      - name: Analyze latest market data
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          VALIDATION_SEED_URL: https://takina6-source.github.io/japan-swing-lens/validation
          EXPERIMENTAL_SEED_URL: https://takina6-source.github.io/japan-swing-lens/experimental
        run: python scripts/export_web.py --refresh --scope "主要500+Growth"
      - run: touch public/dashboard/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/dashboard
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
