name: Update Swing Lens

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      phase2a_run:
        description: "Run the paused Phase 2A production shadow manually"
        required: true
        default: false
        type: boolean
      phase2a_initialize:
        description: "Initialize Phase 2A from the approved cutover manifest"
        required: true
        default: false
        type: boolean
      cutover_manifest_sha256:
        description: "Approved cutover manifest SHA-256 (initialize only)"
        required: false
        type: string
      identity_epoch:
        description: "Approved identity epoch"
        required: true
        default: "phase2a-cutover-v1"
        type: string
  schedule:
    - cron: "0 18 * * 0-4" # JST 月〜金 03:00予定（GitHub Actions の遅延を見込み朝レポート前に完了させる）

permissions: {}

concurrency:
  group: swing-lens-pages
  cancel-in-progress: false

jobs:
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[jquants,test]'
      - name: Run full test suite
        run: python -m pytest -q
      - name: Verify fixed-input regression
        run: python scripts/fixed_input_regression.py
      - name: Verify lossless browser downloads
        run: node tests/js/downloads.test.cjs

  analyze-and-publish:
    name: Analyze and publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # Immutable independent State backup Releases, scoped to this job.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: data
          key: swing-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: swing-data-${{ runner.os }}-
      - name: Restore lightweight snapshot history
        uses: actions/cache@v4
        with:
          path: public/dashboard/snapshot-history
          key: simple-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: simple-history-${{ runner.os }}-
      - run: python -m pip install -e '.[jquants]'
      - name: Select verified continuity authority (cutover locked until approved)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/state_release.py --output "${{ runner.temp }}/state-authority.json"
      - name: Analyze latest market data
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          STATE_AUTHORITY_FILE: ${{ runner.temp }}/state-authority.json
          STATE_HISTORY_FILE: ${{ runner.temp }}/storage-history.json
          STATE_ROOT_URL: https://takina6-source.github.io/japan-swing-lens
          VALIDATION_SEED_URL: https://takina6-source.github.io/japan-swing-lens/validation
          EXPERIMENTAL_SEED_URL: https://takina6-source.github.io/japan-swing-lens/experimental
          RESEARCH_SEED_URL: https://takina6-source.github.io/japan-swing-lens/research
          PHASE2A_INPUT_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.phase2a_run && format('{0}/phase2a-core-input', runner.temp) || '' }}
        run: python scripts/export_web.py --refresh --scope "主要500+Growth"
      - name: Preserve private same-run input for Phase 2A
        if: github.event_name == 'workflow_dispatch' && inputs.phase2a_run
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-core-input-${{ github.run_id }}
          path: ${{ runner.temp }}/phase2a-core-input
          retention-days: 1
          if-no-files-found: error
      - name: Export lightweight daily What Changed
        continue-on-error: true
        run: python scripts/export_simple_changes.py --history-url https://takina6-source.github.io/japan-swing-lens/snapshot-history --retention 30
      - name: Export Morning Brief Core JSON
        id: briefing
        continue-on-error: true
        run: python scripts/export_briefing.py --same-run-config
      - name: Exclude failed Morning Brief from publication
        if: steps.briefing.outcome == 'failure'
        run: |
          python -c "from pathlib import Path; Path('public/dashboard/briefing/latest.json').unlink(missing_ok=True)"
      - name: Export Investment Committee JSON
        continue-on-error: true
        env:
          COMMITTEE_SEED_URL: https://takina6-source.github.io/japan-swing-lens/committee
        run: python scripts/export_committee.py
      - run: touch public/dashboard/.nojekyll
      - name: Stage verified compressed generation and physical storage metrics
        run: |
          mkdir -p "${{ runner.temp }}/continuity-release"
          python scripts/finalize_state.py --source public/dashboard --target public/staged-dashboard --authority "${{ runner.temp }}/state-authority.json" --history "${{ runner.temp }}/storage-history.json" --run-id "${{ github.run_id }}" --commit "${{ github.sha }}" --ledger-output "${{ runner.temp }}/continuity-release/generation.json"
          cp public/staged-dashboard/storage/history.json "${{ runner.temp }}/continuity-release/storage-history.json"
          cp public/staged-dashboard/research/storage_metrics.json "${{ runner.temp }}/continuity-release/storage-metrics.json"
          python scripts/state_backup.py create --pages public/staged-dashboard --archive "${{ runner.temp }}/continuity-release/state-backup.zip" --generation "github-actions-run-${{ github.run_id }}" --market-date "$(python -c "import json; print(json.load(open('public/staged-dashboard/data/snapshot.json'))['as_of'])")" > "${{ runner.temp }}/continuity-release/backup-manifest.json"
      - name: Create immutable continuity Release before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "jsl-state-generation-${{ github.run_id }}" --target "${{ github.sha }}" --title "JSL State generation ${{ github.run_id }}" --notes "Verified independent continuity backup. No asset overwrite. A failed Pages deployment requires reconciliation before the next update." --latest=false "${{ runner.temp }}"/continuity-release/*
      - name: Re-download, checksum and restore before allowing deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "jsl-state-generation-${{ github.run_id }}" --dir "${{ runner.temp }}/independent-redownload"
          cd "${{ runner.temp }}/independent-redownload"
          sha256sum -c state-backup.zip.sha256
          cd "$GITHUB_WORKSPACE"
          cmp "${{ runner.temp }}/continuity-release/generation.json" "${{ runner.temp }}/independent-redownload/generation.json"
          cmp "${{ runner.temp }}/continuity-release/storage-history.json" "${{ runner.temp }}/independent-redownload/storage-history.json"
          cmp "${{ runner.temp }}/continuity-release/storage-metrics.json" "${{ runner.temp }}/independent-redownload/storage-metrics.json"
          python scripts/state_backup.py restore --archive "${{ runner.temp }}/independent-redownload/state-backup.zip" --target "${{ runner.temp }}/independent-restored"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/staged-dashboard
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the deployed State generation and display files
        run: python scripts/verify_state_publication.py --root-url https://takina6-source.github.io/japan-swing-lens --ledger "${{ runner.temp }}/continuity-release/generation.json"

  phase2a-production-shadow:
    name: Phase 2A production shadow (paused / manual only)
    needs: analyze-and-publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.phase2a_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - uses: actions/download-artifact@v4
        with:
          name: phase2a-core-input-${{ github.run_id }}
          path: ${{ runner.temp }}/phase2a-core-input
      - name: Read same-run market date
        id: core
        env:
          CORE_SNAPSHOT: ${{ runner.temp }}/phase2a-core-input/snapshot.json
        run: python -c "import json,os,pathlib; print('expected_date='+json.loads(pathlib.Path(os.environ['CORE_SNAPSHOT']).read_text())['as_of'], file=open(os.environ['GITHUB_OUTPUT'],'a'))"
      - name: Enforce initialize event gate
        if: inputs.phase2a_initialize
        env:
          APPROVED_SHA: ${{ inputs.cutover_manifest_sha256 }}
        run: |
          test "${{ github.event_name }}" = "workflow_dispatch"
          test -n "$APPROVED_SHA"
          test "$(sha256sum docs/phase2a-cutover-manifest.json | cut -d' ' -f1)" = "$APPROVED_SHA"
      - name: Download immutable seed manifests
        if: ${{ !inputs.phase2a_initialize }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{ runner.temp }}/phase2a-release-manifests"
          gh release download phase2a-state-v1 --pattern '*.manifest.json' --dir "${{ runner.temp }}/phase2a-release-manifests"
      - name: Select latest verified predecessor
        if: ${{ !inputs.phase2a_initialize }}
        id: predecessor
        run: python scripts/phase2a_release_seed.py select --manifests-dir "${{ runner.temp }}/phase2a-release-manifests" --before-or-on "${{ steps.core.outputs.expected_date }}" --github-output "$GITHUB_OUTPUT"
      - name: Download selected immutable seed
        if: ${{ !inputs.phase2a_initialize }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.predecessor.outputs.asset_name }}
        run: gh release download phase2a-state-v1 --pattern "$ASSET_NAME" --dir "${{ runner.temp }}/phase2a-download"
      - name: Verify and extract selected seed
        if: ${{ !inputs.phase2a_initialize }}
        env:
          ASSET_NAME: ${{ steps.predecessor.outputs.asset_name }}
          MANIFEST_PATH: ${{ steps.predecessor.outputs.manifest_path }}
        run: python scripts/phase2a_release_seed.py extract --archive "${{ runner.temp }}/phase2a-download/$ASSET_NAME" --manifest "$MANIFEST_PATH" --target "${{ runner.temp }}/phase2a-seed-in"
      - name: Initialize approved cutover
        if: inputs.phase2a_initialize
        id: initialize
        run: python scripts/run_phase2a_production.py --mode initialize --input-dir "${{ runner.temp }}/phase2a-core-input" --db "${{ runner.temp }}/phase2a.sqlite" --output-dir "${{ runner.temp }}/phase2a-artifacts" --seed-output "${{ runner.temp }}/phase2a-seed-out" --release-output "${{ runner.temp }}/phase2a-release-out" --identity-epoch "${{ inputs.identity_epoch }}" --producer-commit-sha "${{ github.sha }}" --cutover-manifest docs/phase2a-cutover-manifest.json --cutover-manifest-sha256 "${{ inputs.cutover_manifest_sha256 }}" --github-output "$GITHUB_OUTPUT"
      - name: Continue from verified seed
        if: ${{ !inputs.phase2a_initialize }}
        id: continuation
        run: python scripts/run_phase2a_production.py --mode continue --input-dir "${{ runner.temp }}/phase2a-core-input" --db "${{ runner.temp }}/phase2a.sqlite" --output-dir "${{ runner.temp }}/phase2a-artifacts" --seed-output "${{ runner.temp }}/phase2a-seed-out" --release-output "${{ runner.temp }}/phase2a-release-out" --identity-epoch "${{ inputs.identity_epoch || 'phase2a-cutover-v1' }}" --producer-commit-sha "${{ github.sha }}" --seed "${{ runner.temp }}/phase2a-seed-in" --previous-release-manifest "${{ steps.predecessor.outputs.manifest_path }}" --github-output "$GITHUB_OUTPUT"
      - name: Create single seed authority Release if needed
        if: steps.initialize.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view phase2a-state-v1 >/dev/null 2>&1 || gh release create phase2a-state-v1 --title "Phase 2A state authority" --notes "Immutable, minimal continuity seeds. No product database or price history."
      - name: Upload immutable seed and manifest
        if: steps.initialize.outputs.promote == 'true' || steps.continuation.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload phase2a-state-v1 "${{ runner.temp }}"/phase2a-release-out/*
      - name: Re-download and verify promoted seed
        if: steps.initialize.outputs.promote == 'true' || steps.continuation.outputs.promote == 'true'
        id: promoted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{ runner.temp }}/phase2a-promoted"
          gh release download phase2a-state-v1 --pattern '*.manifest.json' --dir "${{ runner.temp }}/phase2a-promoted"
          python scripts/phase2a_release_seed.py select --manifests-dir "${{ runner.temp }}/phase2a-promoted" --before-or-on "${{ steps.core.outputs.expected_date }}" --github-output "$GITHUB_OUTPUT"
      - name: Verify promoted archive bytes and seed
        if: steps.initialize.outputs.promote == 'true' || steps.continuation.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.promoted.outputs.asset_name }}
          MANIFEST_PATH: ${{ steps.promoted.outputs.manifest_path }}
        run: |
          gh release download phase2a-state-v1 --pattern "$ASSET_NAME" --dir "${{ runner.temp }}/phase2a-promoted"
          python scripts/phase2a_release_seed.py extract --archive "${{ runner.temp }}/phase2a-promoted/$ASSET_NAME" --manifest "$MANIFEST_PATH" --target "${{ runner.temp }}/phase2a-promoted-seed"
