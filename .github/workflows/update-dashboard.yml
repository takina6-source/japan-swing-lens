name: Update Swing Lens

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1-5" # 平日19:00 JST

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: swing-lens-pages
  cancel-in-progress: false

jobs:
  analyze-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: data
          key: swing-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: swing-data-${{ runner.os }}-
      - run: python -m pip install -e .
      - name: Analyze latest market data
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python scripts/export_web.py --refresh --scope "主要500+Growth"
      - run: touch public/dashboard/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/dashboard
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
