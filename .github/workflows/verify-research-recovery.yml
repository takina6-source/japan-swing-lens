name: Verify research cache recovery

on:
  pull_request:
    paths:
      - 'engine/state_io.py'
      - 'engine/state_generation.py'
      - 'engine/research/storage.py'
      - 'scripts/pages_recovery.py'
      - '.github/workflows/update-dashboard.yml'
      - '.github/workflows/verify-research-recovery.yml'

permissions:
  contents: read
  actions: read

jobs:
  restore-current-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[jquants,test]'
      - name: Restore production cache without saving any changes
        uses: actions/cache/restore@v4
        with:
          path: data
          key: swing-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: swing-data-${{ runner.os }}-
          fail-on-cache-miss: true
      - name: Verify public or pending generation against the actual cached database
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.pages_recovery --root-url https://takina6-source.github.io/japan-swing-lens --work "${{ runner.temp }}/recovery-verification" --github-output "$GITHUB_OUTPUT" --cache-db data/momentum.db
